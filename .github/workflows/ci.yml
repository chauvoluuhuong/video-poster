name: CI
on:
  pull_request: { branches: [dev, main] }
  push: { branches: [dev, main] }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: ./scripts/ci.sh
